apiVersion: apps/v1
kind: Deployment
metadata:
  name: hola-mundo
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hola-mundo
  template:
    metadata:
      labels:
        app: hola-mundo
    spec:
      containers:
        - name: hola-mundo
          image: 423623872289.dkr.ecr.us-east-1.amazonaws.com/microservicio-qa:latest
          ports:
            - containerPort: 8080
